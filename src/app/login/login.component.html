<div class="login-container">
  <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
    <h2>Welcome Back</h2>
    <p>Please sign in to continue</p>

    <div class="form-group">
      <label>Username (Email or Phone)</label>
      <input formControlName="EmailOrPhone" type="text" placeholder="Enter your email or phone" />
    </div>

    <!-- <div class="form-group">
      <label>Password</label>
      <input formControlName="password" type="password" placeholder="Enter your password" />
    </div> -->
    <div class="form-group">
  <label>Password</label>
  <div class="input-icon-wrapper">
    <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Enter password" />
    <i class="toggle-icon" (click)="togglePasswordVisibility('password')">
      {{ showPassword ? 'hide' : 'show' }}
    </i>
  </div>
  </div>

    <div class="action-buttons">
      <button type="submit" [disabled]="loginForm.invalid">Login</button>
      <a class="forgot" (click)="onForgotPassword()">Forgot Password?</a>
    </div>

    <div class="signup-link">
      <span>Don't have an account?</span>
       <a (click)="onSignup()" style="cursor: pointer; color: #007bff;">Sign up</a>
    </div>
  </form>
</div>
